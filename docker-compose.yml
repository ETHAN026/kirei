services:

  postgres:
    image: postgres:16
    container_name: kirei-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kirei

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./coiffure-backend

    container_name: kirei-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./coiffure-backend/.env

    depends_on:
      - postgres


  frontend:
    build:
      context: ./kirei-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}

    container_name: kirei-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data:
